[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory = "netlify/functions"

# API → fonction serverless Express
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# SPA fallback — toutes les routes React → index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
